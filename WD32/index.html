<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Card Design</title>
    <style>
        body {
            background-color: gray;
        }

        .card {
            background-color: white;
            width: 194px;
            height: 344px;
            border-radius: 7px;
        }

        .image {
            padding: 5px;
        }

        img {
            border-radius: 7px;
        }

        .content {
            padding: 3px 13px;
            text-align: justify;
        }

        .content p {
            font-size: 13px;
            color: gray;
        }

        .capsule {
            padding: o 6px;
        }

        .capsule span {
            border: 1px solid rgb(243, 242, 242);
            padding: 2px 4px;
            border-radius: 7px;
            font-size: 10px;
            color: gray;
        }

        .button {
            text-align: center;
        }

        .button button {
            padding: 7px 9px;
            border-radius: 15px;
            background-color: rgb(179, 196, 243);
            color: rgb(8, 150, 215);
            font-size: 10px;
            margin-top: 7px;
            border: none;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="image">
            <img width="184" src="image1.png" alt="image">
            <div class="capsule">
                <span>Nature</span>
                <span>Lake</span>
            </div>
            <div class="content">
                <h2>Content</h2>
                <p>
                    Lorem ipsum, dolor sit amet consectetur adipisicing elit. Tenetur sit iusto corporis ipsa dolorum
                    alias neque id eos itaque deserunt.
                </p>
            </div>
            <div class="button">
                <button>Read More</button>
            </div>
        </div>

    </div>

</body>

</html>
