        /* Pseudo elements   */
        .boxes::before {
            content: "Good Morninggggg";
            color: brown;
        }

        .boxes::after {
            content: "Okeyyy Bye!!!!!!!!!";
            color: brown;
        }
        ::selection{
            color: aqua;
            background-color: blueviolet;
        }
        .box::first-letter{
            color: rgb(18, 170, 109);
            font-size: 30px;
        }
        input::placeholder{
            color: rgb(138, 6, 200);
            font-size: 15px;
        }
    </style>
</head>

<body>
    <div class="boxes">
        <div data-color="primary" class="box">Hey I am a box</div>
        <div class="box">Hey I am a box</div>
        <div class="box">Hey I am a box</div>
        <input type="text" placeholder="Type your name here.">
        <br>
    </div>

</body>
