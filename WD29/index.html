<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card</title>

    <style>
        body {
            background-color: #e6e6e6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .maindiv {
            background-color: white;
            width: 300px;
            padding: 15px;
            border-radius: 20px;
        }

        img {
            width: 100%;
            border-radius: 15px;
        }

        span {
            border: 1px solid gray;
            padding: 4px 10px;
            border-radius: 15px;
            margin-right: 5px;
            color: gray;
            font-size: 14px;
        }

        h2 {
            margin-top: 10px;
        }

        p {
            color: gray;
        }

        .button {
            text-align: center;
        }

        button {
            background-color: #dbeafe;
            color: #2563eb;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
        }
    </style>
</head>

<body>

    <div class="maindiv">

        <img src="image1.png">

        <br><br>

        <span>Nature</span>
        <span>Lake</span>

        <h2>Lago di Braies</h2>

        <p>
            Lorem ipsum dolor sit amet consectetur adipisicing elit.
            Consectetur sodales morbi dignissim sed diam pharetra vitae ipsum odio.
        </p>

        <div class="button">
            <button>Read More</button>
        </div>

    </div>

</body>

</html>
