<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS BOXMODEL</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }
        .box {
            background-color: rgb(169, 232, 232);
        }
        .box1 {
            color: rgb(63, 121, 6);
            border: 5px solid black;
            padding: 20px;
            margin: 10px;
            height: 200px;
            box-sizing: border-box;
        }
        .box2 {
            color: rgb(213, 39, 39);
            border: 5px solid rgb(205, 14, 144);
            padding: 20px;
            margin: 50px;
            height: 200px;
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <div class="box box1">I am a box.</div>
    <div class="box box2"> I am another box.</div>
</body>
</html>
