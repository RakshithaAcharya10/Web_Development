<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Selectors</title>
    <style>
        div{
            /* background-color: aqua; */
        }

        /* Class selector */
        .blue{
            background-color: aqua;
        }

        /* ID selector */
        #green {
            background-color: chartreuse;
        }
        /* Child selector */
        div > p {
            background-color: antiquewhite;
            color: brown;
        }
        /* Descendant selector */
        div p{
            background-color: antiquewhite;
            color: brown;
        }
        /* Universal selector */
        * {
            margin: 0;
            padding: 0;
        }
        /* Pseudo selector */
        a:visited {
            color: rgb(239, 10, 87);
        }
        a:link {
            color: rgb(24, 149, 10);
        }
        a:active {
            background-color: rgb(211, 142, 15);
        }
        a:hover {
            background-color: yellow;
        }
        p:first-child {
            background-color: rgb(112, 13, 212);
        }
    </style>
</head>
<body>
    <div class="one">
        I am one.
    </div>
    <div class="blue">
        I am a div.
        <p>I am para inside div.</p>
        <article>
            <p>
                <p>I am another para inside div.</p>
            </p>
        </article>
    </div>
    <div id="green">I am another div</div>
    <a href="https://www.google.com">Go to Google</a>
    <a href="https://www.facebook2.com">Go to Facebook</a>
</body>
</html>
